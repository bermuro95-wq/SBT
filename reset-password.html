<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Reset Password - SELAM BERTU TESFA</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="style.css" rel="stylesheet">
    <link href="theme.css" rel="stylesheet">
    <link href="ux-polish.css" rel="stylesheet">
    <link rel="stylesheet" href="ux-v2.css">
    <link href="ux-fast.css" rel="stylesheet">
    <link href="ux-smooth.css" rel="stylesheet">
    <link href="responsive.css" rel="stylesheet">
    <link href="responsive-all.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header text-center">
                <img src="assets/images/logo.png" alt="SELAM BERTU TESFA" class="auth-logo" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%22120%22><text y=%2230%22 font-size=%2220%22>SBT</text></svg>'">
                <h1 class="auth-title">SELAM BERTU TESFA</h1>
                <p class="auth-subtitle">Reset Your Password</p>
            </div>
            
            <div class="auth-body">
                <div id="reset-status-banner" class="alert alert-secondary">Verifying your reset link…</div>
                <div id="reset-form">
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i>
                        Please enter your new password below.
                    </div>
                    
                    <div class="mb-3">
                        <label for="new-password" class="form-label">New Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="new-password" 
                                   placeholder="Enter new password" required minlength="8">
                            <button class="btn btn-outline-secondary" type="button" id="toggle-password-1">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <small class="text-muted">Minimum 8 characters with uppercase, lowercase, and number</small>
                    </div>
                    
                    <div class="mb-3">
                        <label for="confirm-password" class="form-label">Confirm Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="confirm-password" 
                                   placeholder="Confirm new password" required>
                            <button class="btn btn-outline-secondary" type="button" id="toggle-password-2">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100" id="reset-btn">
                        <span id="reset-text">Reset Password</span>
                        <span id="reset-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                    </button>
                    
                    <div id="reset-message" class="mt-3"></div>
                    
                    <div class="text-center mt-3">
                        <a href="login.html" class="text-decoration-none">
                            <i class="bi bi-arrow-left"></i> Back to Login
                        </a>
                    </div>
                </div>
            </div>
            
            <div class="auth-footer text-center text-muted">
                <small>© 2026 SELAM BERTU TESFA ORGANIZATION</small>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Core JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="i18n.js"></script>
    <script src="auth.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const newPassword = document.getElementById('new-password');
            const confirmPassword = document.getElementById('confirm-password');
            const resetBtn = document.getElementById('reset-btn');
            const resetText = document.getElementById('reset-text');
            const resetSpinner = document.getElementById('reset-spinner');
            const resetMessage = document.getElementById('reset-message');

            function showMessage(message, type) {
                if (!resetMessage) return;
                resetMessage.className = 'alert alert-' + type + ' mt-3';
                resetMessage.textContent = message;
                resetMessage.classList.remove('d-none');
            }
            function hideMessage() {
                if (resetMessage) resetMessage.classList.add('d-none');
            }

            const t1 = document.getElementById('toggle-password-1');
            const t2 = document.getElementById('toggle-password-2');
            if (t1) t1.addEventListener('click', function() {
                const type = newPassword.type === 'password' ? 'text' : 'password';
                newPassword.type = type;
                this.querySelector('i').className = type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
            });
            if (t2) t2.addEventListener('click', function() {
                const type = confirmPassword.type === 'password' ? 'text' : 'password';
                confirmPassword.type = type;
                this.querySelector('i').className = type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
            });

            // Establish recovery session from the email link tokens
            let sessionReady = false;
            try {
                const url = new URL(window.location.href);
                const hash = window.location.hash ? window.location.hash.substring(1) : '';
                const hashParams = new URLSearchParams(hash);
                const type = hashParams.get('type') || url.searchParams.get('type') || '';
                const code = url.searchParams.get('code');
                const accessToken = hashParams.get('access_token');
                const refreshToken = hashParams.get('refresh_token');

                if (code) {
                    const { data, error } = await supabase.auth.exchangeCodeForSession(code);
                    if (error) console.warn('exchangeCodeForSession', error);
                    else sessionReady = !!(data && data.session);
                } else if (accessToken && refreshToken) {
                    const { data, error } = await supabase.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    });
                    if (error) console.warn('setSession', error);
                    else sessionReady = !!(data && data.session);
                } else {
                    const { data } = await supabase.auth.getSession();
                    sessionReady = !!(data && data.session);
                }

                if (hash || code) {
                    try {
                        window.history.replaceState({}, document.title, window.location.pathname);
                    } catch (e) {}
                }
                if (type === 'recovery') sessionReady = sessionReady || true;
            } catch (err) {
                console.warn('Recovery session setup', err);
            }

            var banner = document.getElementById('reset-status-banner');
            if (banner) banner.classList.add('d-none');
            if (!sessionReady) {
                const { data } = await supabase.auth.getSession();
                sessionReady = !!(data && data.session);
            }

            var banner = document.getElementById('reset-status-banner');
            if (banner) banner.classList.add('d-none');
            if (!sessionReady) {
                showMessage('This reset link is invalid or has expired. Please request a new password reset from the login page.', 'danger');
                if (resetBtn) resetBtn.disabled = true;
                const info = document.querySelector('#reset-form .alert-info');
                if (info) {
                    info.className = 'alert alert-warning';
                    info.innerHTML = '<i class="bi bi-exclamation-triangle"></i> Open the link from your email again, or <a href="login.html">go to Login</a> and use Forgot Password.';
                }
            } else {
                if (banner) { banner.className = 'alert alert-success'; banner.textContent = 'Reset link verified. Enter your new password.'; banner.classList.remove('d-none'); }
                showMessage('Link verified. Choose a new password below.', 'success');
                setTimeout(hideMessage, 4000);
            }

            async function doReset() {
                const password = (newPassword && newPassword.value) || '';
                const confirm = (confirmPassword && confirmPassword.value) || '';

                if (!password || password.length < 8) {
                    showMessage('Password must be at least 8 characters.', 'danger');
                    return;
                }
                if (password !== confirm) {
                    showMessage('Passwords do not match.', 'danger');
                    return;
                }
                if (!/[A-Z]/.test(password) || !/[a-z]/.test(password) || !/\d/.test(password)) {
                    showMessage('Password must contain uppercase, lowercase, and a number.', 'danger');
                    return;
                }

                const { data: sess } = await supabase.auth.getSession();
                if (!sess || !sess.session) {
                    showMessage('Session expired. Please request a new reset link from the login page.', 'danger');
                    return;
                }

                resetBtn.disabled = true;
                if (resetText) resetText.textContent = 'Updating...';
                if (resetSpinner) resetSpinner.classList.remove('d-none');
                hideMessage();

                let result = { success: false };
                try {
                    if (typeof AUTH !== 'undefined' && AUTH.updatePassword) {
                        result = await AUTH.updatePassword(password);
                    } else {
                        const { error } = await supabase.auth.updateUser({ password: password });
                        if (error) throw error;
                        result = { success: true };
                    }
                } catch (err) {
                    result = { success: false, error: err.message || 'Failed to update password' };
                }

                resetBtn.disabled = false;
                if (resetText) resetText.textContent = 'Reset Password';
                if (resetSpinner) resetSpinner.classList.add('d-none');

                if (result.success) {
                    showMessage('Password updated successfully! Redirecting to login...', 'success');
                    try { await supabase.auth.signOut(); } catch (e) {}
                    setTimeout(function() { window.location.href = 'login.html'; }, 1800);
                } else {
                    showMessage(result.error || 'Failed to update password. Please try again.', 'danger');
                }
            }

            if (resetBtn) resetBtn.addEventListener('click', doReset);
            if (newPassword) newPassword.addEventListener('keypress', function(e) { if (e.key === 'Enter') doReset(); });
            if (confirmPassword) confirmPassword.addEventListener('keypress', function(e) { if (e.key === 'Enter') doReset(); });
        });
    </script>

</body>
</html>
